<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}NPL Sim{% endblock %}</title>
<style>{{ gameday_css | safe }}</style>
<style>
header.site{border-bottom:1px solid var(--line);background:var(--panel)}
header.site nav{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header.site a{color:var(--fg);text-decoration:none}header.site .brand{font-weight:700}
header.site a.link{color:var(--muted)}header.site a.link:hover{color:var(--fg)}
a{color:var(--accent)}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
:root[data-theme=dark] .btn,.dark-btn{color:#0b1220}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{color:#0b1220}}
.btn.secondary{background:none;color:var(--accent);border:1px solid var(--line)}
select,input[type=text],input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 6px;max-width:100%}
.grid2{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:880px){.grid2{grid-template-columns:1fr 1fr}}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:20px}
.card h2{margin-bottom:10px}
.status{position:sticky;top:0;z-index:2;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:20px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.status ul{margin:4px 0 0;padding-left:18px}.err{color:#c62828}.warn{color:#9a6700}.ok{color:#1b7f3b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .err{color:#ff8a80}:root:not([data-theme=light]) .warn{color:#f2c94c}:root:not([data-theme=light]) .ok{color:#7bd88f}}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.order td,.order th{text-align:left}.order td:first-child{width:24px;color:var(--muted)}
.order select{width:100%}
tr.inactive td{color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12px}
.banner{background:var(--score);border-radius:6px;padding:8px 12px;margin-bottom:16px}
.form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.order-list{list-style:none;margin:0;padding:0}
.slot{display:grid;grid-template-columns:20px 18px minmax(0,1fr) 64px auto auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.slot .num{color:var(--muted);font-variant-numeric:tabular-nums}
.slot select{width:100%}
.grip{cursor:grab;color:var(--muted);text-align:center;touch-action:none;user-select:none;font-size:16px}
.moves{display:inline-flex;gap:2px}
.slot .line{font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.stats td,.stats th{white-space:nowrap;text-align:left}
@media (max-width:560px){.slot .line{display:none}.slot{grid-template-columns:20px 18px minmax(0,1fr) 64px auto}}
.stats .g{text-align:center;font-variant-numeric:tabular-nums}
.mv{background:none;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:10px;padding:2px 5px;cursor:pointer}
.mv:hover,.mv:focus-visible{color:var(--fg)}
.slot.dragging,tr.dragging{opacity:.4}tr.over td,tbody.over td{background:color-mix(in srgb,var(--accent) 14%,transparent)}.pen th{text-align:left;font-size:12px;color:var(--muted);padding-top:8px}.nowrap{white-space:nowrap}.slot.over{outline:2px solid var(--accent);outline-offset:-2px}
.bench{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:3px 10px;cursor:grab;touch-action:none;user-select:none}
.chip small{color:var(--muted)}
.ghost{position:fixed;pointer-events:none;z-index:10;opacity:.9;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:90vw}
.rotation td,.rotation th{text-align:left}.rotation select{max-width:190px}
label.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
label.field{display:inline-flex;flex-direction:column;gap:2px;margin:4px 14px 6px 0;font-size:13px;color:var(--muted)}
label.field select{color:var(--fg);max-width:100%}label.field{max-width:100%}label.field.wide{display:flex}
fieldset.pinch{border:0;padding:0;margin:0;min-width:0}fieldset.pinch.off{opacity:.45}
.never{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.head-row h2{margin:0}.small-btn{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.form-row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header class="site"><nav>
<a class="brand" href="/">NPL Sim</a>
<a class="link" href="/">Teams</a>
<a class="link" href="/games/new">Sim a game</a>
</nav></header>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
