# NPL league alignment. Divisions are realigned every two offseasons:
# add a new alignment block (or edit this one) rather than changing code.
# `from_season` is the first season this alignment applies to; a block stays
# in force until a later `from_season` replaces it.
#
# 2026/2027 is the alignment Dave set on 2026-10-14, before the next
# realignment. Within each division the teams are in his order, so rivals
# default to the first two and the last two; set `rivals` on a division to
# change that. `wild_cards` is the wild card spots per league (default 2).
alignments:
  - from_season: 2026
    wild_cards: 2
    leagues:
      - name: AL
        dh: true
        divisions:
          - name: Oil Can
            teams: [New York Valkyries, Milwaukee DockHounds, Chicago Orphans, Hill Valley McFlys]
          - name: Splendid Splinter
            teams: [Chicago Kodiaks, Midwest Ducksnorts, Los Angeles Bulldog, Asbury Park Bosses]
          - name: Sultan of Swat
            teams: [Dallas Perwar, Lion King, London Calling, Bad Guys]
      - name: NL
        dh: true
        divisions:
          - name: Big Train
            teams: [Cheesequake Cheddar, Denver Bears, Durham Tobacconists, Quebec Quails]
          - name: Say Hey Kid
            teams: [Honolulu Hitmen, Frozen Ropes, Winterfell Starks, Old Sturbridge Villagers]
          - name: Stan The Man
            teams: [Central City Speedsters, Rats, Brooklyn TOOTBLANs, Nuremberg GmbH]
